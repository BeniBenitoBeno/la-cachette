<body>

<main class="maisons colonnes" id="maisons">

  <a class="maison" id="m-grimaud" href="grimaud.html" aria-label="La Cachette Grimaud, golfe de Saint-Tropez">
    <span class="maison__media" data-media>
      <img src="assets/img/grimaud/piscine-jardin.jpg" alt="La Cachette — Grimaud, golfe de Saint-Tropez" loading="eager" decoding="async">
    </span>
    <span class="maison__texte">
      <span class="maison__index">01</span>
      <h2 class="maison__nom">Grimaud</h2>
      <span class="maison__lieu">Golfe de Saint-Tropez · Var</span>
      <span class="maison__lien"><i></i>Découvrir la maison</span>
    </span>
  </a>

  <a class="maison" id="m-maurice" href="ile-maurice.html" aria-label="La Cachette Île Maurice">
    <span class="maison__media" data-media>
      <img src="assets/img/maurice/gazebo-depuis-la-piscine.jpg" alt="La Cachette — Île Maurice" loading="eager" decoding="async">
    </span>
    <span class="maison__texte">

      <span class="maison__lien"><i></i>Découvrir la maison</span>
    </span>
  </a>

</main>

<script>
  /* Si une photo manque encore, la bande bascule sur son emblème gravé
     et affiche un discret « Photos à venir ». Dépose simplement
     assets/img/grimaud.jpg ou assets/img/vars.jpg pour l'activer. */
  document.querySelectorAll('[data-media] img').forEach(function (img) {
    function vide() {
      var media = img.closest('[data-media]');
      if (media.classList.contains('vide')) return;
      media.classList.add('vide');
      var tag = document.createElement('span');
      tag.className = 'maison__bientot';
      tag.textContent = 'Photos à venir';
      media.parentElement.appendChild(tag);
    }
    img.addEventListener('error', vide);
    if (img.complete && img.naturalWidth === 0) vide();
  });

  /* Sur écran tactile il n'y a pas de survol : la bande la plus proche
     du centre de l'écran prend la couleur, les autres restent grises. */
  (function () {
    if (!window.matchMedia('(hover: none)').matches) return;
    var conteneur = document.getElementById('maisons');
    var bandes = Array.prototype.slice.call(conteneur.querySelectorAll('.maison'));
    var enAttente = false;

    function reveler() {
      enAttente = false;
      var centre = window.innerHeight / 2;
      var gagnante = null, meilleure = Infinity;
      bandes.forEach(function (b) {
        var r = b.getBoundingClientRect();
        var d = Math.abs(r.top + r.height / 2 - centre);
        if (d < meilleure) { meilleure = d; gagnante = b; }
      });
      bandes.forEach(function (b) { b.classList.toggle('est-active', b === gagnante); });
      conteneur.classList.toggle('a-une-active', !!gagnante);
    }

    function planifier() {
      if (enAttente) return;
      enAttente = true;
      requestAnimationFrame(reveler);
    }

    window.addEventListener('scroll', planifier, { passive: true });
    window.addEventListener('resize', planifier);
    reveler();
  })();
</script>

</body>
</html>
